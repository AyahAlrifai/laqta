# Unsigned test installers for Windows and macOS, attached to a GitHub pre-release.
#
# Runs on a pushed version tag (v*) or by hand from the Actions tab (Run workflow). It builds
# exactly what `pnpm dist:win:unsigned` and `pnpm dist:mac:unsigned` build (electron-builder
# .unsigned.yml): no code-signing certificate, an ad-hoc signature on macOS, no notarization,
# no update feed. These are NOT the signed release artefacts of spec section 11 (that pipeline
# is .gitlab-ci.yml), so the release is always marked as a pre-release.
#
# Actions are pinned to full commit SHAs (the tag is in the comment) so a moved tag cannot
# change what runs.

name: Unsigned installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
            files: |
              app/dist-unsigned/*.exe
          - os: macos-latest
            platform: --mac
            files: |
              app/dist-unsigned/*.dmg
              app/dist-unsigned/*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        # Bash on every runner: the build sets LAQTA_RELEASE with POSIX syntax.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No version input: the action reads "packageManager": "pnpm@12.18.0".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The app's postinstall downloads the Electron binary and checks its checksum.
      - run: pnpm install --frozen-lockfile

      - name: Release build
        run: LAQTA_RELEASE=1 pnpm --filter @laqta/app exec electron-vite build

      - name: Check the bundle has no API key or dev-only provider
        run: node tools/check-release-bundle.js app/out

      - name: Package
        working-directory: app
        run: pnpm exec electron-builder ${{ matrix.platform }} --config electron-builder.unsigned.yml --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Create the pre-release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # A tag push uses its tag; a manual run gets its own tag from the run number.
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('unsigned-{0}', github.run_number) }}
        run: |
          ls -la installers
          gh release create "$TAG" installers/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Laqta $TAG (unsigned test build)" \
            --notes "Unsigned test installers built from ${GITHUB_SHA::7}. Not the signed release.

          - Windows: SmartScreen warns on first run. Choose More info, then Run anyway.
          - macOS: universal (Apple Silicon and Intel), ad-hoc signed and not notarized. On first launch, right-click Laqta and choose Open."
