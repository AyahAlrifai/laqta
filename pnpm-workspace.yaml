packages:
  - app
  - gateway-contract

# Spec section 10: no install scripts from unknown packages. get-windows (window mode, spec
# section 5 step 6) downloads its prebuilt native helper in its install script; nothing else
# may run one.
allowBuilds:
  get-windows: true
  # esbuild (via tsx) works from its platform package without its check script; the Squirrel
  # installer is unused because Windows builds use NSIS (spec section 11).
  esbuild: false
  electron-winstaller: false

# Security fixes in get-windows' install-time tooling (pnpm audit --prod):
# - node-gyp is an auto-installed peer used only to build from source; the prebuilt helper is
#   used instead, so it is removed.
# - node-pre-gyp unpacks the prebuilt Windows helper with tar; pin a patched tar.
overrides:
  node-gyp: '-'
  '@mapbox/node-pre-gyp>tar': 7.5.22
